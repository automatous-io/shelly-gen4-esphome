# Shelly Plug US Gen4 — full model config: relay, button, LED ring,
# BL0942 power metering, and the LTR-329 light sensor.
#

substitutions:
  device_name: "shelly-plug-us-gen4"
  friendly_name: "Shelly Plug US Gen4"
  relay_linking: "Linked" # Linked or Unlinked; "Detached" button mode in stock firmware
  relay_mode: "Latch"     # Latch or Momentary
  relay_pulse: "500 ms"   # Pulse length in Momentary mode
  relay_restore: "RESTORE_DEFAULT_OFF" # Relay power-on behavior (RESTORE_DEFAULT_ON, ALWAYS_OFF, ALWAYS_ON, ...)
  ring_mode: "Power" # Power, Relay State, or Manual; stock's LED modes, Power is stock's default
  ring_max_power: "1800" # Power mode turns the ring fully red at this many watts
  log_level: "INFO" # Logger verbosity (DEBUG, VERBOSE for troubleshooting)
  ap_password: "automatous" # Fallback hotspot password
  factory_reset_hold: "5s" # Button hold time before factory reset
  line_frequency: "60Hz" # Mains frequency
  power_update_interval: "10s" # How often the power meter publishes
  light_update_interval: "10s" # How often the light sensor publishes
  window_factor: "2.9" # Illuminance multiplier for the light the front window blocks, measured against a light meter
  dark_threshold: "5" # Illumination is dark below this many lux
  bright_threshold: "100" # Illumination is bright above this many lux
  voltage_reference: "25169.82830" # BL0942 voltage scaling, measured on this board
  current_reference: "248840.32040" # BL0942 current scaling, measured on this board

packages:
  base: !include shelly-gen4-base.yaml

# stock firmware leaves pad hold on the relay pin, and it survives the web UI
# conversion. without this the relay stays frozen until the device is power-cycled.
esphome:
  on_boot:
    - priority: 1000
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_4);
    - priority: -100
      then:
        - script.execute: ring_apply

# converted devices broadcast this URL. The ESPHome dashboard can offer adoption.
# false keeps adopted stubs as references, every rebuild pulls updates from this repo.
dashboard_import:
  package_import_url: github://automatous-io/shelly-gen4-esphome/configs/shelly-plug-us-gen4.yaml@main
  import_full_config: false

# In Momentary mode the relay turns itself back off after the selected pulse.
switch:
  - platform: gpio
    name: "Relay"
    id: relay_1
    pin: GPIO4
    restore_mode: ${relay_restore}
    on_turn_off:
      - script.execute: ring_apply
    on_turn_on:
      - script.execute: ring_apply
      - if:
          condition:
            lambda: 'return id(relay_mode_select).current_option() == "Momentary";'
          then:
            - delay: !lambda |-
                auto s = id(pulse_select).current_option();
                if (s == "100 ms") return 100;
                if (s == "250 ms") return 250;
                if (s == "500 ms") return 500;
                if (s == "1 s") return 1000;
                if (s == "2 s") return 2000;
                if (s == "5 s") return 5000;
                return 500;
            - switch.turn_off: relay_1

# runtime settings, exposed in Home Assistant and on the device web page.
# substitutions set the initial values; changes made here persist across reboots.
select:
  - platform: template
    name: "Relay Linking"
    id: relay_linking_select
    optimistic: true
    options:
      - Linked
      - Unlinked
    initial_option: ${relay_linking}
    restore_value: true

  - platform: template
    name: "Relay Mode"
    id: relay_mode_select
    optimistic: true
    options:
      - Latch
      - Momentary
    initial_option: ${relay_mode}
    restore_value: true

  - platform: template
    name: "Pulse Length"
    id: pulse_select
    optimistic: true
    options:
      - "100 ms"
      - "250 ms"
      - "500 ms"
      - "1 s"
      - "2 s"
      - "5 s"
    initial_option: ${relay_pulse}
    restore_value: true

  # Power colors the ring green to red by load, Relay State shows green on and red off,
  # Manual leaves the ring to Home Assistant
  - platform: template
    name: "Ring Mode"
    id: ring_mode_select
    optimistic: true
    options:
      - Power
      - Relay State
      - Manual
    initial_option: ${ring_mode}
    restore_value: true
    on_value:
      - script.execute: ring_apply

binary_sensor:
  # onboard button: short press toggles the relay, long hold factory resets.
  # Unlinked reports presses to Home Assistant only, leaving the relay alone.
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO7
      inverted: true
      mode: INPUT_PULLUP
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                lambda: 'return id(relay_linking_select).current_option() == "Linked";'
              then:
                - switch.toggle: relay_1
      - timing:
          - ON for at least ${factory_reset_hold}
        then:
          - button.press: btn_factory_reset

# 12-pixel ring on the back of the plug
light:
  - platform: esp32_rmt_led_strip
    name: "LED Ring"
    id: led_ring
    pin: GPIO6
    num_leds: 12
    chipset: WS2812
    rgb_order: GRB
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      # same rhythm as the status LED on the other models
      - addressable_lambda:
          name: "Status Blink"
          update_interval: 50ms
          lambda: |-
            uint32_t now = millis();
            bool on = (App.get_app_state() & STATUS_LED_ERROR) ? now % 250 < 150 : now % 1500 < 250;
            it.all() = on ? Color(0, 0, 255) : Color::BLACK;

globals:
  - id: ring_status_active
    type: bool
    initial_value: "false"

script:
  - id: ring_apply
    mode: restart
    then:
      - lambda: |-
          auto mode = id(ring_mode_select).current_option();
          if (mode == "Manual" || id(ring_status_active)) return;
          bool on = id(relay_1).state;
          auto call = id(led_ring).make_call();
          if (mode == "Relay State") {
            call.set_state(true);
            call.set_rgb(on ? 0 : 1, on ? 1 : 0, 0);
          } else if (!on) {
            call.set_state(false);
          } else {
            float p = id(sensor_power).state;
            float f = std::isnan(p) ? 0.0f : std::clamp(p / (float) ${ring_max_power}, 0.0f, 1.0f);
            call.set_state(true);
            call.set_rgb(std::min(1.0f, 2 * f), std::min(1.0f, 2 * (1 - f)), 0);
          }
          call.perform();

# blinks the ring while Wi-Fi or the API is down, at status_led's rhythm on the other models,
# then puts the ring back as it was
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static light::LightColorValues saved;
          // connection only: other components' transient warnings (the light sensor retrying
          // a reading) would otherwise blink the ring
          bool down = !wifi::global_wifi_component->is_connected() || !api::global_api_server->is_connected();
          if (down == id(ring_status_active)) return;
          id(ring_status_active) = down;
          if (down) {
            saved = id(led_ring).remote_values;
            auto call = id(led_ring).make_call();
            call.set_save(false);
            call.set_state(true);
            call.set_brightness(0.6f);
            call.set_effect("Status Blink");
            call.perform();
            return;
          }
          // the effect has to be cleared while the light is on, then the saved state restored
          auto clear = id(led_ring).make_call();
          clear.set_save(false);
          clear.set_state(true);
          clear.set_effect("None");
          clear.perform();
          auto restore = id(led_ring).make_call();
          restore.set_transition_length(0);
          restore.set_save(false);
          restore.from_light_color_values(saved);
          restore.perform();
          id(ring_apply).execute();

# BL0942 power meter. the logger owns UART0, so this runs on UART1.
# the meter's TX line needs the pull-up; without it RX idles low and nothing is received.
uart:
  id: uart_bl0942
  tx_pin: GPIO18
  rx_pin:
    number: GPIO19
    mode:
      input: true
      pullup: true
  baud_rate: 9600
  stop_bits: 1

i2c:
  sda: GPIO10
  scl: GPIO11

sensor:
  - platform: bl0942
    uart_id: uart_bl0942
    line_frequency: ${line_frequency}
    update_interval: ${power_update_interval}
    voltage_reference: ${voltage_reference}
    current_reference: ${current_reference}
    voltage:
      name: "Voltage"
      id: sensor_voltage
      entity_category: diagnostic
    current:
      name: "Current"
      id: sensor_current
    power:
      name: "Power"
      id: sensor_power
      on_value:
        - if:
            condition:
              lambda: 'return id(ring_mode_select).current_option() == "Power";'
            then:
              - script.execute: ring_apply
    frequency:
      name: "Frequency"
      id: sensor_frequency
      accuracy_decimals: 2
      entity_category: diagnostic
    energy:
      name: "Energy"
      id: sensor_energy
      device_class: energy
      state_class: total_increasing
      accuracy_decimals: 3

  # LTR-329 behind the dark front window. lux is computed here rather than by the component:
  # its formula publishes 0 whenever infrared dominates, which this window causes in dim light.
  # window_factor corrects for the light the window absorbs.
  - platform: ltr_als_ps
    address: 0x29
    type: ALS
    update_interval: ${light_update_interval}
    full_spectrum_counts:
      name: "Light Counts"
      id: light_ch0
      internal: true
    infrared_counts:
      name: "Light IR Counts"
      id: light_ch1
      internal: true
    actual_gain:
      name: "Light Gain"
      id: light_gain
      internal: true
    actual_integration_time:
      name: "Light Integration Time"
      id: light_itime
      internal: true
      # published last in each reading
      on_value:
        - component.update: sensor_illuminance

  # LTR-329 datasheet formula; the IR-dominant case uses its last band instead of 0
  - platform: template
    name: "Illuminance"
    id: sensor_illuminance
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      float ch0 = id(light_ch0).state, ch1 = id(light_ch1).state;
      float gain = id(light_gain).state, itime = id(light_itime).state;
      if (std::isnan(ch0) || std::isnan(ch1) || !(gain > 0) || !(itime > 0)) return {};
      if (ch0 + ch1 <= 0) return 0.0f;
      float ratio = ch1 / (ch0 + ch1), lux;
      if (ratio < 0.45f) lux = 1.7743f * ch0 + 1.1059f * ch1;
      else if (ratio < 0.64f) lux = 4.2785f * ch0 - 1.9548f * ch1;
      else lux = 0.5926f * ch0 + 0.1185f * ch1;
      return std::max(0.0f, lux / gain / (itime / 100.0f) * (float) ${window_factor});
    on_value:
      - text_sensor.template.publish:
          id: illumination
          state: !lambda |-
            if (x < ${dark_threshold}) return {"dark"};
            if (x > ${bright_threshold}) return {"bright"};
            return {"twilight"};

# stock firmware's dark / twilight / bright categories
text_sensor:
  - platform: template
    name: "Illumination"
    id: illumination

# the component warns on every dim reading when infrared dominates; Illuminance is unaffected
logger:
  logs:
    ltr_als_ps: ERROR
