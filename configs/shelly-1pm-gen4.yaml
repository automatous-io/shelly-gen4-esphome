# Shelly 1PM Gen4 — full model config: relay, switch input, button, status LED,
# BL0942 power metering, and the onboard NTC.
#

substitutions:
  device_name: "shelly-1pm-gen4"
  friendly_name: "Shelly 1PM Gen4"
  relay_linking: "Linked" # Linked or Unlinked; "Detached mode" in stock firmware
  relay_mode: "Latch"     # Latch or Momentary
  relay_pulse: "500 ms"   # Pulse length in Momentary mode
  relay_restore: "RESTORE_DEFAULT_OFF" # Relay power-on behavior (RESTORE_DEFAULT_ON, ALWAYS_OFF, ALWAYS_ON, ...)
  input_debounce: "50ms" # Switch input debounce filter
  log_level: "INFO" # Logger verbosity (DEBUG, VERBOSE for troubleshooting)
  ap_password: "automatous" # Fallback hotspot password
  factory_reset_hold: "5s" # Button hold time before factory reset
  line_frequency: "60Hz" # Mains frequency; 50Hz outside North America
  power_update_interval: "10s" # How often the power meter publishes
  ntc_b_constant: "3350" # NTC beta value, estimated
  voltage_reference: "14462.09548" # BL0942 voltage scaling, measured on this board
  current_reference: "253772.51527" # BL0942 current scaling, measured on this board
  max_power: "3680" # Overpower limit in W, up to the 3680 W rating
  max_current: "16" # Overcurrent limit in A, up to the 16 A rating
  max_voltage: "280" # Overvoltage limit in V, up to 280 V
  max_temperature: "95" # Overheating limit in °C on the board NTC; Shelly's documented 95 °C

packages:
  base: !include shelly-gen4-base.yaml

# converted devices broadcast this URL. The ESPHome dashboard can offer adoption.
# false keeps adopted stubs as references, every rebuild pulls updates from this repo.
dashboard_import:
  package_import_url: github://automatous-io/shelly-gen4-esphome/configs/shelly-1pm-gen4.yaml@main
  import_full_config: false

# O terminal relay. In Momentary mode it turns itself back off after the selected pulse.
switch:
  - platform: gpio
    name: "Relay"
    id: relay_1
    pin: GPIO4
    restore_mode: ${relay_restore}
    # turning on clears the faults, unless voltage or temperature is still over its limit
    on_turn_on:
      - lambda: |-
          bool high = id(sensor_voltage).state > id(max_voltage_number).state;
          bool hot = id(sensor_temperature).get_raw_state() > ${max_temperature};
          id(fault_overpower).publish_state(false);
          id(fault_overcurrent).publish_state(false);
          id(fault_overvoltage).publish_state(high);
          id(fault_overheating).publish_state(hot);
          if (high || hot) id(relay_1).turn_off();
      - if:
          condition:
            lambda: 'return id(relay_mode_select).current_option() == "Momentary";'
          then:
            - script.execute: relay_pulse_off
    on_turn_off:
      - script.stop: relay_pulse_off

# restart mode gives every pulse its full length, even when the relay is turned
# back on mid-pulse. turning the relay off cancels the pending pulse.
script:
  - id: relay_pulse_off
    mode: restart
    then:
      - delay: !lambda |-
          auto s = id(pulse_select).current_option();
          if (s == "100 ms") return 100;
          if (s == "250 ms") return 250;
          if (s == "500 ms") return 500;
          if (s == "1 s") return 1000;
          if (s == "2 s") return 2000;
          if (s == "5 s") return 5000;
          return 500;
      - switch.turn_off: relay_1

# runtime settings, exposed in Home Assistant and on the device web page.
# substitutions set the initial values; changes made here persist across reboots.
select:
  - platform: template
    name: "Relay Linking"
    id: relay_linking_select
    optimistic: true
    options:
      - Linked
      - Unlinked
    initial_option: ${relay_linking}
    restore_value: true

  - platform: template
    name: "Relay Mode"
    id: relay_mode_select
    optimistic: true
    options:
      - Latch
      - Momentary
    initial_option: ${relay_mode}
    restore_value: true

  - platform: template
    name: "Pulse Length"
    id: pulse_select
    optimistic: true
    options:
      - "100 ms"
      - "250 ms"
      - "500 ms"
      - "1 s"
      - "2 s"
      - "5 s"
    initial_option: ${relay_pulse}
    restore_value: true

# protection limits, settable up to the device's rating like stock's
number:
  - platform: template
    name: "Max Power"
    id: max_power_number
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${max_power}
    min_value: 0
    max_value: 3680
    step: 1
    unit_of_measurement: "W"
    mode: box
  - platform: template
    name: "Max Current"
    id: max_current_number
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${max_current}
    min_value: 0
    max_value: 16
    step: 0.1
    unit_of_measurement: "A"
    mode: box
  - platform: template
    name: "Max Voltage"
    id: max_voltage_number
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${max_voltage}
    min_value: 0
    max_value: 280
    step: 1
    unit_of_measurement: "V"
    mode: box

binary_sensor:
  # SW terminal; toggles the relay when the input turns on. Unlinked reports the
  # input to Home Assistant only, leaving the relay alone.
  - platform: gpio
    name: "Switch Input"
    id: switch_input
    pin: GPIO10
    filters:
      - delayed_on_off: ${input_debounce}
    on_press:
      - if:
          condition:
            lambda: 'return id(relay_linking_select).current_option() == "Linked";'
          then:
            - switch.toggle: relay_1

  # onboard button: short press toggles the relay, long hold factory resets
  - platform: gpio
    name: "Button"
    id: onboard_button
    pin:
      number: GPIO1
      inverted: true
      mode: INPUT_PULLUP
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - switch.toggle: relay_1
      - timing:
          - ON for at least ${factory_reset_hold}
        then:
          - button.press: btn_factory_reset

  # stock's protections. each latches on when it turns the relay off and clears when the
  # relay is turned back on. a trip takes two readings in a row over the limit while on.
  - platform: template
    name: "Overpower"
    id: fault_overpower
    device_class: problem
  - platform: template
    name: "Overcurrent"
    id: fault_overcurrent
    device_class: problem
  - platform: template
    name: "Overvoltage"
    id: fault_overvoltage
    device_class: problem
  - platform: template
    name: "Overheating"
    id: fault_overheating
    device_class: problem

# BL0942 power meter. the logger owns UART0, so this runs on UART1.
# 9600 baud, not the chip's 4800 default; a mismatch logs "BL0942 setup failed!" at boot.
uart:
  id: uart_bl0942
  tx_pin: GPIO6
  rx_pin:
    number: GPIO7
    mode:
      input: true
      pullup: true
  baud_rate: 9600
  stop_bits: 1

sensor:
  # metering. the references are measured on this board; ESPHome's defaults assume the
  # BL0942 reference design and read ~9% low. power and energy derive from these two,
  # so setting power_reference by hand makes them worse.
  - platform: bl0942
    uart_id: uart_bl0942
    line_frequency: ${line_frequency}
    update_interval: ${power_update_interval}
    voltage_reference: ${voltage_reference}
    current_reference: ${current_reference}
    voltage:
      name: "Voltage"
      id: sensor_voltage
      entity_category: diagnostic
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = id(relay_1).state && x > id(max_voltage_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_1).turn_off();
              id(fault_overvoltage).publish_state(true);
            }
    current:
      name: "Current"
      id: sensor_current
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = id(relay_1).state && x > id(max_current_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_1).turn_off();
              id(fault_overcurrent).publish_state(true);
            }
    power:
      name: "Power"
      id: sensor_power
      on_value:
        - lambda: |-
            static uint8_t over = 0;
            over = id(relay_1).state && x > id(max_power_number).state ? over + 1 : 0;
            if (over >= 2) {
              over = 0;
              id(relay_1).turn_off();
              id(fault_overpower).publish_state(true);
            }
    frequency:
      name: "Frequency"
      id: sensor_frequency
      accuracy_decimals: 2
      entity_category: diagnostic
    energy:
      name: "Energy"
      id: sensor_energy
      device_class: energy
      state_class: total_increasing
      accuracy_decimals: 3

  # onboard NTC on a 10k divider. the beta value is an estimate, not measured.
  # the base package's "Internal Temperature" is the ESP32-C6 die sensor, not this one.
  - platform: ntc
    name: "Temperature"
    id: sensor_temperature
    sensor: temp_resistance
    entity_category: diagnostic
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: ${ntc_b_constant}
      reference_resistance: 10kOhm
      reference_temperature: 25°C
    # Overheating checks every 10 s reading; Home Assistant still gets one a minute
    filters:
      - throttle: 60s
    on_raw_value:
      - lambda: |-
          static uint8_t over = 0;
          over = id(relay_1).state && x > ${max_temperature} ? over + 1 : 0;
          if (over >= 2) {
            over = 0;
            id(relay_1).turn_off();
            id(fault_overheating).publish_state(true);
          }

  - platform: resistance
    id: temp_resistance
    sensor: temp_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    internal: true

  - platform: adc
    id: temp_voltage
    update_interval: 10s
    pin: GPIO3
    attenuation: 12db
    internal: true

# Status LED: blinks while Wi-Fi/API are disconnected (setup or reconnecting), off when healthy.
status_led:
  pin:
    number: GPIO11
    inverted: true
